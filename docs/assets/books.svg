<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#161b22"/>
  <!-- Stack of Books -->
  <g transform="translate(300, 160)">
    <!-- Bottom book -->
    <rect x="0" y="100" width="180" height="34" rx="4" fill="#21262d" stroke="#f0883e" stroke-width="3"/>
    <line x1="15" y1="117" x2="165" y2="117" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Middle book -->
    <rect x="10" y="60" width="150" height="30" rx="4" fill="#21262d" stroke="#8b949e" stroke-width="3"/>
    <line x1="25" y1="75" x2="145" y2="75" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Top book tilted -->
    <g transform="rotate(-6 20 40)">
      <rect x="20" y="20" width="140" height="30" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="3"/>
      <line x1="35" y1="35" x2="145" y2="35" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- API nodes connecting -->
  <circle cx="200" cy="240" r="10" fill="#3fb950"/>
  <circle cx="600" cy="200" r="10" fill="#a371f7"/>
  <circle cx="550" cy="320" r="10" fill="#58a6ff"/>
  
  <path d="M 210,240 L 290,240 M 490,200 L 590,200 M 470,270 L 540,315" fill="none" stroke="#30363d" stroke-width="4" stroke-dasharray="8 8"/>
</svg>