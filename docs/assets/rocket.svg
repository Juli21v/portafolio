<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#161b22"/>
  <!-- Orbit -->
  <path d="M 150,350 Q 400,100 650,200" fill="none" stroke="#30363d" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Planet -->
  <circle cx="150" cy="350" r="80" fill="#21262d" stroke="#30363d" stroke-width="3"/>
  <circle cx="650" cy="200" r="30" fill="#21262d" stroke="#a371f7" stroke-width="3"/>
  
  <!-- Rocket -->
  <g transform="translate(380, 160) rotate(45)">
    <path d="M -15,40 L 0,60 L 15,40 Z" fill="#f0883e"/>
    <rect x="-15" y="10" width="30" height="30" rx="4" fill="#8b949e"/>
    <path d="M 0,-20 L 15,10 L -15,10 Z" fill="#58a6ff"/>
  </g>
  <!-- API brackets -->
  <text x="440" y="320" font-family="monospace" font-size="48" font-weight="bold" fill="#3fb950">{ }</text>
</svg>