<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#161b22"/>
  <!-- Columns -->
  <rect x="180" y="100" width="130" height="250" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="335" y="100" width="130" height="250" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="490" y="100" width="130" height="250" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  
  <!-- Cards -->
  <rect x="195" y="140" width="100" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <rect x="195" y="210" width="100" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <rect x="350" y="140" width="100" height="90" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  
  <rect x="505" y="140" width="100" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  
  <!-- Mini lines inside cards -->
