  <line x1="210" y1="230" x2="270" y2="230" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="250" x2="250" y2="250" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
  <line x1="365" y1="160" x2="430" y2="160" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
  <line x1="365" y1="180" x2="410" y2="180" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
  <line x1="520" y1="160" x2="580" y2="160" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
</svg>